[project]
name = "merchant_ops"
authors = [{ name = "Michael Appiah", email = "michael@ultrasoftsystems.com" }]
description = "Merchant commercial-to-cash operations on ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"
